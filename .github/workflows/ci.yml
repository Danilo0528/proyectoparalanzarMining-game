name: CI

on:
  push:
    branches: [main, "redesign/*"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Type check (non-blocking for legacy API errors)
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          # Provide a placeholder so the build doesn't fail on missing secrets.
          # Replace with real values via repository secrets when deploying.
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-placeholder-secret' }}
          MONGODB_URI: ${{ secrets.MONGODB_URI || 'mongodb://localhost:27017/ci' }}

